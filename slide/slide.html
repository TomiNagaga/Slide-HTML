<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="slide.css">
</head>
<body>
<div class="slider">
    <!-- 画像表示部分 -->
    <div class="slider_outer">
        <div class="slider_container">
            <div class="slider_item">
                <img src="tokagedoro.png" alt="チョコレートドーナツ" width="250" height="250">
            </div>
            <div class="slider_item">
                <img src="logo.jpg" alt="ホワイトチョコレートドーナツ" width="250" height="250">
            </div>
            <div class="slider_item">
                <img src="posuta-.jpg" alt="ハニーシロップドーナツ" width="250" height="250">
            </div>
        </div>
    </div>

    <!-- 進むボタンと戻るボタン -->
    <button type="button" class="next_btn">▶️</button>
    <button type="button" class="back_btn">◀️</button>
    
    <!-- ドットインジケータ -->
    <div class="indicator_container">
        <div class="indicator indicator1"></div>
        <div class="indicator"></div>
        <div class="indicator"></div>
    </div>
</div>


   <script src="./slide.js"></script>
</body>
</html>
